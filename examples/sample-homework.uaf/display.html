<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAF - 作业</title>
<style>
@page { size: A4 portrait; margin: 0; }
@media print {
  body { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #F8FAFC;
  color: #0F172A;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif;
}
.document {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14pt;
  align-items: start;
  padding: 40pt;
}
.card {
  break-inside: avoid;
  page-break-inside: avoid;
  background: #FFFFFF;
  border: 1pt solid #E2E8F0;
  border-radius: 16pt;
  box-shadow: 0 2pt 8pt rgba(148, 163, 184, 0.15);
  padding: 24pt;
  overflow: hidden;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12pt;
  padding-bottom: 20pt;
  border-bottom: 1pt solid #E2E8F0;
}
.subject-pill {
  display: inline-block;
  min-width: 0;
  background: #2563EB;
  color: #FFFFFF;
  font-size: 14pt;
  line-height: 1.2;
  padding: 8pt 16pt;
  border-radius: 9999pt;
  overflow-wrap: anywhere;
}
.date-pill {
  display: inline-block;
  flex: 0 0 auto;
  background: #F1F5F9;
  color: #334155;
  font-size: 12pt;
  line-height: 1.2;
  padding: 6pt 12pt;
  border-radius: 9999pt;
  white-space: nowrap;
}
.content {
  margin-top: 20pt;
  color: #0F172A;
  font-size: 22pt;
  line-height: 1.5;
  text-align: left;
  overflow-wrap: anywhere;
}
.tags {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8pt;
  margin-top: 20pt;
}
.tag-chip {
  justify-self: start;
  min-width: 0;
  max-width: 100%;
  background: #E0E7FF;
  color: #3730A3;
  font-size: 11pt;
  padding: 5pt 10pt;
  border-radius: 9999pt;
  overflow-wrap: anywhere;
}
.continued { color: #64748B; font-size: 11pt; margin-top: 20pt; }
.watermark {
  position: fixed;
  right: 40pt;
  bottom: 40pt;
  color: #94A3B8;
  opacity: 0.5;
  font-size: 10pt;
  pointer-events: none;
}
</style>
</head>
<body>
<main class="document"><article class="card">
  <header class="header">
    <span class="subject-pill">数学</span>
    <span class="date-pill">2026年5月19日</span>
  </header>
  <div class="content">完成课本第45页第1、2题，请拍照上传。</div>
  <div class="tags"><span class="tag-chip">必做</span><span class="tag-chip">几何</span><span class="tag-chip">重难点</span></div>
</article>
<article class="card">
  <header class="header">
    <span class="subject-pill">语文</span>
    <span class="date-pill">2026年5月19日</span>
  </header>
  <div class="content">背诵《静夜思》，完成第二段仿写。</div>
  <div class="tags"><span class="tag-chip">背诵</span></div>
</article>
<article class="card">
  <header class="header">
    <span class="subject-pill">英语</span>
    <span class="date-pill">2026年5月19日</span>
  </header>
  <div class="content">朗读课文 Unit 3 并完成练习册。</div>
</article></main>
<div class="watermark">使用 UAF v1.0 导出</div>
<template id="uaf-payload-csv" data-filename="uaf_payload.csv">subject,date,content,tags
数学,2026-05-19,完成课本第45页第1、2题，请拍照上传。,必做;几何;重难点
语文,2026-05-19,背诵《静夜思》，完成第二段仿写。,背诵
英语,2026-05-19,朗读课文 Unit 3 并完成练习册。,
</template>
</body>
</html>
