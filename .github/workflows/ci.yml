name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: implementations/typescript

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Generate sample artifacts
        run: pnpm run generate:sample

      - name: Verify sample artifacts
        run: pnpm run verify:sample

      - name: Package sample artifact set
        run: pnpm run package:sample

      - name: Read sample artifact set
        run: pnpm run read:sample-package

      - name: Test
        run: pnpm test

  flutter-dart:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            dart: "3.8.0"
            web: false
          - os: ubuntu-latest
            dart: stable
            web: true
          - os: windows-latest
            dart: stable
            web: false
          - os: macos-latest
            dart: stable
            web: false
    defaults:
      run:
        working-directory: implementations/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - uses: actions/setup-node@v4
        if: matrix.web
        with:
          node-version: "20"

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        if: matrix.web
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Compile platform-neutral API for web
        if: matrix.web
        run: dart compile js tool/web_smoke.dart -o build/web_smoke.js

      - name: Run platform-neutral web smoke test
        if: matrix.web
        run: node build/web_smoke.js

      - name: Test platform-neutral APIs in Chrome
        if: matrix.web
        run: >-
          dart test -p chrome
          test/artifact_manifest_test.dart
          test/html_test.dart
          test/pdf_test.dart

  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/csharp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet run --project tests/UnifiedAssignmentFormat.Tests
